<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230f172a' /><path d='M 75 24 L 49 24 L 49 64 A 12 12 0 0 1 25 64 M 49 44 L 71 44' fill='none' stroke='%2338bdf8' stroke-width='12' stroke-linecap='round' stroke-linejoin='round' /></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaden Fann Portfolio</title>
    <meta name="description" content="Portfolio of Jaden Fann — Mechanical Engineer at Blue Origin (Lunar Lander MK II) and UC Berkeley M.S. Mechanical Engineering graduate specializing in robotics, actuation mechanisms, and mechatronic design." />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-render-blocking font load (display=swap shows fallback text until fonts arrive) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"></noscript>
    <!-- Theme Initializer: executes synchronously before first paint to prevent FOUC / white flash -->
    <script>
      (function() {
        var theme = localStorage.getItem('cad-theme-v2');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.style.backgroundColor = '#141C28';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.style.backgroundColor = '#f8fafc';
        }
      })();
      // Preload the first project's shaded poster (the LCP image) for the active theme.
      // Must match ModelViewer's URL exactly: first modelType in projectsData + POSTER_VERSION.
      (function() {
        var dark = localStorage.getItem('cad-theme-v2') === 'dark';
        var lcp = document.createElement('link');
        lcp.rel = 'preload';
        lcp.as = 'image';
        lcp.setAttribute('fetchpriority', 'high');
        lcp.href = './posters/tesla-actuator-shaded-' + (dark ? 'dark' : 'light') + '.png?v=20261012-v4';
        document.head.appendChild(lcp);
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#141C28] text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-blue-500 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
